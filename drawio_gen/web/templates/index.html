<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Генератор блок-схем + Код в Word</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="5.5" rx="1.6" class="logo-node"/>
            <rect x="2" y="16.5" width="6" height="5.5" rx="1.6" class="logo-node"/>
            <rect x="16" y="16.5" width="6" height="5.5" rx="1.6" class="logo-node"/>
            <path d="M12 7.5V11M5 16.5V13.75A1.25 1.25 0 0 1 6.25 12.5h11.5A1.25 1.25 0 0 1 19 13.75V16.5" class="logo-line"/>
          </svg>
        </span>
        <div class="brand__text">
          <h1 id="app-title">Генератор блок-схем</h1>
          <p id="app-hint" class="hint">Код <b>Python</b> или <b>C#</b> → файл <code>.drawio</code> с одной страницей на функцию</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="mode-tabs" role="tablist" aria-label="Режим">
          <button id="mode-diagram" class="mode-tab mode-tab--active" type="button" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            Блок-схема
          </button>
          <button id="mode-word" class="mode-tab" type="button" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M6 5h4v6h-4v-2h4v6h-4M14 7v10"/>
            </svg>
            Код в Word
          </button>
        </div>
        <label class="language">
          <span class="language__label">Язык</span>
          <select id="language" aria-label="Язык программирования">
            <option value="auto">Авто</option>
            {% for lid, lname in languages %}
            <option value="{{ lid }}">{{ lname }}</option>
            {% endfor %}
          </select>
        </label>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Переключить тему" title="Сменить тему">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="workspace">
      <div class="pane editor-pane">
        <div class="pane-head">
          <span class="pane-title">
            <svg class="pane-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/>
            </svg>
            Код программы
          </span>
          <span id="pane-hint" class="pane-hint">Ctrl / ⌘ + Enter — построить</span>
        </div>
        <textarea id="code" spellcheck="false" placeholder="def main():
    ..."></textarea>

        <div class="actions">
          <button id="convert" type="button" class="btn btn-primary mode-diagram-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg>
            Построить блок-схему
          </button>
          <button id="download-diagram" type="button" class="btn btn-ghost mode-diagram-btn" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>
            </svg>
            Скачать .drawio
          </button>
          <button id="format" type="button" class="btn btn-primary mode-word-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg>
            Форматировать
          </button>
          <button id="copy-word" type="button" class="btn btn-ghost mode-word-btn" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M6 5h4v6h-4v-2h4v6h-4M14 7v10"/>
            </svg>
            Копировать в Word
          </button>
          <button id="download-docx" type="button" class="btn btn-ghost mode-word-btn" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>
            </svg>
            Скачать .docx
          </button>
        </div>

        <p id="status" class="status" role="status"></p>
      </div>

      <div class="pane preview-pane">
        <div class="preview-head">
          <span class="pane-title">
            <svg class="pane-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/>
              <circle cx="12" cy="12" r="2.6"/>
            </svg>
            Предпросмотр
          </span>
          <div id="tabs" class="tabs mode-diagram-el" role="tablist"></div>
          <div class="zoom mode-diagram-el">
            <button id="zoom-out" type="button" title="Уменьшить" aria-label="Уменьшить">−</button>
            <span id="zoom-level">60%</span>
            <button id="zoom-in" type="button" title="Увеличить" aria-label="Увеличить">+</button>
          </div>
          <span id="lang-label" class="lang-label mode-word-el"></span>
        </div>
        <div id="preview" class="preview">
          <div class="preview-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8.5" y="2" width="7" height="5" rx="1.5"/>
              <rect x="2" y="17" width="7" height="5" rx="1.5"/>
              <rect x="15" y="17" width="7" height="5" rx="1.5"/>
              <path d="M12 7v3M5.5 17v-3.5h13V17" fill="none"/>
            </svg>
            <p>Здесь появится схема</p>
            <span>Вставьте код и нажмите «Построить блок-схему»</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Открывайте результат в <a href="https://app.diagrams.net" target="_blank" rel="noopener">app.diagrams.net</a></span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
